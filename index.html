<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울역 실시간 안내</title>
<style>
:root{--g:#3ddc84;--a:#ff8a2b;--r:#ff4d3d;--y:#ffd23f;--w:#f2f5f2}
*{box-sizing:border-box;cursor:none}
html,body{margin:0;height:100%;background:#000;color:var(--w);font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden}
/* 1920x1080 고정 무대를 화면에 맞게 확대/축소 (TV 16:9) */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#050605;overflow:hidden}
.slide{position:absolute;inset:0;padding:48px 64px 84px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .6s}
.slide.on{opacity:1;pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;color:#9aa59e;font-size:34px}
.clk{font:700 54px ui-monospace,monospace;color:#3ddc84}
.logo{display:flex;align-items:center;gap:16px;font-weight:700;color:#e6eee9}
.logo i{width:48px;height:48px;border-radius:50%;background:#1f7fd0;border:6px solid #fff}
.badge{display:inline-block;color:#fff;border-radius:99px;padding:4px 22px;font-weight:700;font-size:32px;margin-left:16px}

/* KORAIL */
.kslide{background:#000}
.kt{text-align:center;color:#fff;font-weight:700;letter-spacing:.9em;font-size:62px;margin:30px 0 10px;padding-left:.9em}
.kb{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.kh,.kr{display:grid;grid-template-columns:240px 240px 200px 1fr 170px 170px;gap:12px;align-items:center;font-size:48px;padding:10px 0;border-bottom:4px solid rgba(61,220,132,.7)}
.kh{color:var(--y);font-size:30px;font-weight:700}
.kr{color:#fff;font-weight:600}
.kr.hot{color:var(--a)}
.kr.hot .dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--a);margin-right:10px}
.krl{color:#ff5b3a;font-weight:800;font-style:italic;font-size:42px}

/* Subway */
.sslide{background:linear-gradient(160deg,#0f4a42 0%,#062624 60%,#041514 100%)}
.sbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:56px}
.tr{display:grid;grid-template-columns:200px 1fr auto;align-items:center;gap:24px}
.tr .lb{color:#d5ded9;font-size:38px}
.tr .ds{font-size:116px;font-weight:700;color:#fff;white-space:nowrap}
.tr.first .ds{color:var(--y)}
.tr .ds small{font-size:44px;font-weight:400;color:#d5ded9;margin-left:12px}
.tr .mn{display:flex;align-items:center;gap:16px;justify-content:flex-end}
.tr .mn b{font-size:150px;line-height:1;color:#35d7ff;font-weight:800}
.tr.second .mn b{color:#fff}
.tr .mn small{font-size:36px;line-height:1.25;color:#d5ded9;text-align:left}
.rail{position:relative;margin:120px 140px 120px}
.rail .arrow{position:absolute;right:10px;top:-110px;font-size:70px;color:#fff}
.rail .line{height:18px;border-radius:9px}
.rail .st{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.rail .nm{position:absolute;top:40px;transform:translateX(-50%);font-size:38px;color:#e6eee9;white-space:nowrap}
.rail .st.end{width:40px;height:40px;border:7px solid #35d7ff;background:#0a2e2b}
.train{position:absolute;top:50%;width:200px;transform:translate(-50%,-88%);transition:left 1s linear;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.train.t2{width:140px;opacity:.85;z-index:1}
.train svg{width:100%;display:block}
.train .no{display:block;width:max-content;margin:0 auto 4px;font:700 28px ui-monospace,monospace;background:#fff;color:#111;border-radius:6px;padding:2px 10px;border:1px solid #999}
.train.t2 .no{font-size:22px}

/* Map */
.mslide{background:#050605}
.leg{display:flex;gap:18px;margin-top:20px}
.leg .badge{margin:0}
#mapbox{position:relative;flex:1;margin-top:20px;border-radius:20px;background:#0a1210;border:2px solid #1d2a25;overflow:hidden;min-height:0}
#kmap,#fb{position:absolute;inset:0;width:100%;height:100%}
#fb{display:none}
.tl{fill:#fff;font-size:20px;font-weight:700;stroke:#000;stroke-width:4px;paint-order:stroke}
.sn{fill:#c9d4cd;font-size:17px;stroke:#0a1210;stroke-width:3.5px;paint-order:stroke}
.trk{transition:transform 1s linear}
.mk{display:flex;flex-direction:column;align-items:center;width:130px}
.mk .no{font:700 18px/1 ui-monospace,monospace;background:#fff;color:#111;border-radius:5px;padding:3px 7px;margin-bottom:2px;border:1px solid #888}
.mk svg{width:96px;height:46px;filter:drop-shadow(0 2px 3px #000)}
.mk .eta{font:700 20px/1.3 "Noto Sans KR",sans-serif;color:#fff;background:rgba(0,0,0,.72);border-radius:12px;padding:0 10px;margin-top:2px;white-space:nowrap}
.stl{background:rgba(0,0,0,.62);color:#fff;font-size:18px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;transform:translate(60%,0)}

#dots{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:14px;z-index:900}
#dots span{width:14px;height:14px;border-radius:50%;background:#333}
#dots span.on{background:var(--y)}
#st{position:absolute;left:24px;bottom:18px;font-size:22px;color:#7a857e;z-index:900}
#st b{color:var(--a)}
#ms{position:absolute;right:24px;bottom:18px;font-size:22px;color:#ff8a2b;z-index:900;max-width:60%;text-align:right}
</style>
</head>
<body>
<div id="stage"><div id="dots"></div><div id="st"></div><div id="ms"></div></div>

<script>
// ============ 설정 (여기만 고치면 돼요) ============
const CONFIG = {
  API_KEY: "",      // 서울 열린데이터광장 키. 공개 저장소에는 넣지 말고 프록시를 쓰세요
  BASE: "http://swopenAPI.seoul.go.kr/api/subway", // 프록시 주소로 교체 (예: https://xxx.workers.dev/subway)
  STATION: "서울",
  WORKER: "https://seoul-station-api.mimiling217.workers.dev",       // Cloudflare Worker 주소 (예: https://seoul-station-api.내이름.workers.dev) - 넣으면 실시간 데이터 사용
  KORAIL_URL: "",   // (WORKER를 쓰면 필요 없음)
  KAKAO_KEY: "b9e3f476d9ccce23e09ba4828f585436",    // 카카오 JavaScript 키 (비우면 직접 그린 노선도 지도)
  REFRESH_SEC: 30,
  SECONDS: {sub: 8, korail: 10, map: 14},  // 페이지별 표시 시간(초)
  RELOAD_HOURS: 3                           // 자동 새로고침 주기
};
const STATION_GAP_SEC = 150;

const STN = {
  "서울역":[37.5547,126.9707],
  "시청":[37.5657,126.9769],"종각":[37.5702,126.9831],"종로3가":[37.5704,126.9921],
  "남영":[37.5413,126.9713],"용산":[37.5299,126.9648],"노량진":[37.5132,126.9425],
  "회현":[37.5585,126.9782],"명동":[37.5609,126.9863],"충무로":[37.5613,126.9942],
  "숙대입구":[37.5448,126.9722],"삼각지":[37.5347,126.9732],"신용산":[37.5291,126.9674],"이촌":[37.5222,126.9742],
  "공덕":[37.5436,126.9516],"홍대입구":[37.5568,126.9245]
};
const LINES = {
  "1001": {n:"1호선", c:"#0052A4", mc:"#2f7fe0", path:["노량진","용산","남영","서울역","시청","종각","종로3가"],
    from:{"상행":["노량진","용산","남영"],"하행":["종로3가","종각","시청"]}},
  "1004": {n:"4호선", c:"#00A5DE", mc:"#00B9F0", path:["이촌","신용산","삼각지","숙대입구","서울역","회현","명동","충무로"],
    from:{"상행":["신용산","삼각지","숙대입구"],"하행":["충무로","명동","회현"]}},
  "1065": {n:"공항철도", c:"#0090D2", mc:"#2aa8ee", path:["홍대입구","공덕","서울역"],
    from:{"상행":["홍대입구","공덕"],"하행":["홍대입구","공덕"]}},
  "1063": {n:"경의중앙", c:"#77C4A3", mc:"#77C4A3", dash:"10 8", path:["홍대입구","공덕","서울역"],
    from:{"상행":["홍대입구","공덕"],"하행":["홍대입구","공덕"]}}
};
let data = [], korail = null, idx = 0, timer, fetchedAt = Date.now(), TR = [], KM = null, mapSec;

function demo() {
  return [
    {subwayId:"1001",bstatnNm:"봉화산",updnLine:"상행",barvlDt:"360",btrainNo:"1018"},
    {subwayId:"1001",bstatnNm:"신내",updnLine:"상행",barvlDt:"900",btrainNo:"1022"},
    {subwayId:"1001",bstatnNm:"인천",updnLine:"하행",barvlDt:"120",btrainNo:"1019"},
    {subwayId:"1001",bstatnNm:"신창",updnLine:"하행",barvlDt:"600",btrainNo:"1031"},
    {subwayId:"1004",bstatnNm:"당고개",updnLine:"상행",barvlDt:"200",btrainNo:"4108"},
    {subwayId:"1004",bstatnNm:"당고개",updnLine:"상행",barvlDt:"680",btrainNo:"4112"},
    {subwayId:"1004",bstatnNm:"오이도",updnLine:"하행",barvlDt:"300",btrainNo:"4215"},
    {subwayId:"1004",bstatnNm:"안산",updnLine:"하행",barvlDt:"780",btrainNo:"4219"},
    {subwayId:"1065",bstatnNm:"인천공항2터미널",updnLine:"하행",barvlDt:"240",btrainNo:"A101"},
    {subwayId:"1063",bstatnNm:"문산",updnLine:"상행",barvlDt:"660",btrainNo:"K305"}
  ];
}
const KORAIL_DEMO = [
  ["06:25","DMZ","1950","고향","0","70년",1],["20:19","KTX 산천","175","순천","1","0분"],
  ["20:23","새마을","1153","익산","7","0분"],["20:30","ITX 청춘","2021","춘천","1","0분"],
  ["20:39","KTX 산천","197","광주송정","9","0분"],["20:52","KTX","316","익산","4","0분"],
  ["21:05","KTX","412","부산","8","0분"],["21:12","ITX 새마을","1161","대전","2","0분"],
  ["21:20","KTX 산천","183","목포","11","0분"],["21:28","무궁화","1303","영주","5","0분"],
  ["21:40","KTX","318","강릉","3","0분"],["21:47","ITX 청춘","2029","용문","6","0분"],
  ["21:55","KTX 산천","189","여수엑스포","10","3분"],["22:05","KTX","424","동대구","12","0분"]
];
const KORAIL_PER_PAGE = 8;

const el = h => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const clk = () => `<span class="clk" data-clk></span>`;
const trainInner = c => `<path d="M2 10Q2 5 7 5H40Q56 5 62 18V22Q62 26 58 26H6Q2 26 2 22Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <rect x="8" y="11" width="32" height="6" rx="3" fill="${c}"/><path d="M44 11Q52 11 56 17H44Z" fill="${c}"/>
  <rect x="3" y="20.5" width="57" height="2.6" fill="${c}"/><circle cx="14" cy="27.5" r="2.4" fill="#222"/><circle cx="48" cy="27.5" r="2.4" fill="#222"/>`;
const trainSVG = c => `<svg viewBox="0 0 64 30">${trainInner(c)}</svg>`;

function korailSlide(p = 0) {
  const all = korail || KORAIL_DEMO, pages = Math.max(1, Math.ceil(all.length / KORAIL_PER_PAGE));
  p = p % pages;
  const rows = all.slice(p * KORAIL_PER_PAGE, (p + 1) * KORAIL_PER_PAGE);
  return el(`<section class="slide kslide" data-dur="${CONFIG.SECONDS.korail}"><div class="top"><span class="logo">서울역</span><span class="krl">KORAIL${pages > 1 ? ` ${p + 1}/${pages}` : ""}</span></div>
    <div class="kt">열차출발안내</div>
    <div class="kb">
      <div class="kh"><span>출발시간</span><span>열차종류</span><span>열차번호</span><span>도착역</span><span>타는곳</span><span>지연</span></div>
      ${rows.map(r => `<div class="kr ${r[6]?"hot":""}"><span>${r[6]?'<i class="dot"></i>':""}${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span><span>${r[3]}</span><span>${r[4]}</span><span>${r[5]}</span></div>`).join("")}
    </div></section>`);
}
function groups() {
  const out = [];
  Object.keys(LINES).forEach(id => ["상행","하행"].forEach(dir => {
    const g = data.filter(d => d.subwayId === id && d.updnLine === dir)
      .sort((a,b) => (+a.barvlDt||0) - (+b.barvlDt||0)).slice(0,2);
    if (g.length) out.push({id, dir, g});
  }));
  return out;
}
function subSlide({id, dir, g}) {
  const L = LINES[id], S = [...L.from[dir], "서울역"], n = S.length - 1, pos = i => 8 + 84 * i / n;
  const row = (d,i) => `<div class="tr ${i?"second":"first"}"><span class="lb">${i?"다음열차":"이번열차"}</span>
    <span class="ds">${d.bstatnNm}<small>행</small></span>
    <span class="mn" data-eta="${+d.barvlDt||0}"><b></b><small>분후<br>도착예정</small></span></div>`;
  return el(`<section class="slide sslide" data-dur="${CONFIG.SECONDS.sub}"><div class="top">
    <span class="logo"><i></i>서울교통공사<span class="badge" style="background:${L.c}">${L.n} ${dir}</span></span>${clk()}</div>
    <div class="sbody">${g.map(row).join("")}</div>
    <div class="rail"><span class="arrow">→</span>
      <div class="line" style="background:linear-gradient(90deg,#ffb020,${L.c} 40%,#ff5a3c)"></div>
      ${S.map((s,i)=>`<span class="st ${i===n?"end":""}" style="left:${pos(i)}%"></span><span class="nm" style="left:${pos(i)}%">${s}</span>`).join("")}
      ${g.map((d,i)=>`<span class="train ${i?"t2":""}" data-eta="${+d.barvlDt||0}" data-n="${n}"><b class="no">${d.btrainNo||""}</b>${trainSVG(i?"#8a9a92":L.mc)}</span>`).join("")}
    </div></section>`);
}

// ---------- 지도 ----------
const proj = ([la,lo]) => [30 + (lo - 126.89) / 0.16 * 1540, 30 + (37.575 - la) / 0.0657 * 740];
function makeMapSec() {
  mapSec = el(`<section class="slide mslide" data-dur="${CONFIG.SECONDS.map}"><div class="top"><span class="logo">열차 위치 지도</span>${clk()}</div>
    <div class="leg">${Object.values(LINES).map(L=>`<span class="badge" style="background:${L.c}">${L.n}</span>`).join("")}</div>
    <div id="mapbox"><div id="kmap"></div><svg id="fb" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet"><g id="fbs"></g><g id="fbt"></g></svg></div></section>`);
}
function drawFallback() {
  let s = "";
  for (let i = 0; i <= 16; i++) s += `<line x1="${30+i*96}" y1="0" x2="${30+i*96}" y2="800" stroke="#13201b"/>`;
  for (let i = 0; i <= 8; i++) s += `<line x1="0" y1="${30+i*96}" x2="1600" y2="${30+i*96}" stroke="#13201b"/>`;
  Object.values(LINES).forEach(L => s += `<polyline points="${L.path.map(n=>proj(STN[n]).join(",")).join(" ")}" fill="none" stroke="${L.mc}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" ${L.dash?`stroke-dasharray="${L.dash}"`:""}/>`);
  const seen = {};
  Object.values(LINES).forEach(L => L.path.forEach(n => { if (seen[n] || n === "서울역") return; seen[n] = 1;
    const [x,y] = proj(STN[n]); s += `<circle cx="${x}" cy="${y}" r="7" fill="#fff"/><text class="sn" x="${x+12}" y="${y+6}">${n}</text>`; }));
  const [x,y] = proj(STN["서울역"]);
  s += `<circle cx="${x}" cy="${y}" r="16" fill="#0a1210" stroke="#ffd23f" stroke-width="5"/><text class="tl" x="${x+22}" y="${y+30}" style="fill:#ffd23f;font-size:26px">서울역</text>`;
  document.getElementById("fbs").innerHTML = s;
}
function showFallback(why) {
  if (why) document.getElementById("ms").textContent = why;
  KM = null; TR.forEach(T => { if (T.mk) T.mk.setMap(null); T.mk = null; });
  document.getElementById("kmap").style.display = "none";
  document.getElementById("fb").style.display = "block";
  setTrains();
}
function initKakao() {
  drawFallback();
  if (!CONFIG.KAKAO_KEY) { showFallback("지도: 파일에 카카오 키가 없어요 (새 파일 업로드 확인)"); return; }
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_KEY}&autoload=false`;
  s.onload = () => {
    if (!window.kakao || !kakao.maps) { showFallback("지도: 카카오가 응답했지만 지도를 못 불러옴 (키/도메인 확인)"); return; }
    kakao.maps.load(() => { try { buildKakao(); } catch (e) { showFallback("지도 생성 오류: " + e.message); } });
  };
  s.onerror = () => showFallback("지도: 카카오 연결 실패 → 도메인 등록 또는 카카오맵 ON 확인");
  document.head.appendChild(s);
  setTimeout(() => { if (!KM) showFallback("지도: 10초 안에 안 떠서 노선도로 대체"); }, 10000);   // 10초 안에 안 뜨면 노선도로 대체
}
function buildKakao() {
  const K = kakao.maps, ll = a => new K.LatLng(a[0], a[1]);
  KM = new K.Map(document.getElementById("kmap"), {center: ll(STN["서울역"]), level: 6});
  KM.setMapTypeId(K.MapTypeId.HYBRID);   // 위성 + 지명
  const b = new K.LatLngBounds(); Object.values(STN).forEach(a => b.extend(ll(a))); KM.setBounds(b); KM.setLevel(Math.max(1, KM.getLevel() - 1));   // 한 단계 더 확대
  Object.values(LINES).forEach(L => new K.Polyline({map:KM, path:L.path.map(n=>ll(STN[n])), strokeWeight:7, strokeColor:L.mc, strokeOpacity:.95, strokeStyle:L.dash?"shortdash":"solid"}));
  Object.entries(STN).forEach(([n,a]) => new K.CustomOverlay({map:KM, position:ll(a), yAnchor:.5, content:`<div class="stl">${n}</div>`}));
  setTrains();
}
function setTrains() {
  TR.forEach(T => { if (T.mk) T.mk.setMap(null); });
  TR = [];
  const fbt = document.getElementById("fbt"); if (fbt) fbt.innerHTML = "";
  let fb = "";
  groups().forEach(({id, dir, g}) => {
    const L = LINES[id], S = [...L.from[dir], "서울역"], d = g[0], k = TR.length;
    const T = {eta:+d.barvlDt||0, ll:S.map(n=>STN[n]), n:S.length-1, name:L.n, no:d.btrainNo||""};
    if (KM) {
      T.el = el(`<div class="mk">${T.no?`<b class="no">${T.no}</b>`:""}${trainSVG(L.mc)}<span class="eta"></span></div>`);
      T.mk = new kakao.maps.CustomOverlay({map:KM, position:new kakao.maps.LatLng(T.ll[0][0],T.ll[0][1]), content:T.el, yAnchor:.85, xAnchor:.5});
    } else fb += `<g class="trk" data-f="${k}"><svg x="-48" y="-46" width="96" height="46" viewBox="0 0 64 30">${trainInner(L.mc)}</svg><text class="tl" y="-52" text-anchor="middle">${T.no}</text><text class="tl" data-eta-t y="26" text-anchor="middle"></text></g>`;
    TR.push(T);
  });
  if (fbt) fbt.innerHTML = fb;
  tick();
}

// ---------- 페이지 순서: 지하철 2장 → 코레일 → 지하철 2장 → 지도 → 지하철 2장 → 코레일 ----------
function render() {
  const subs = groups().map(subSlide), pairs = [];
  for (let i = 0; i < subs.length; i += 2) pairs.push(subs.slice(i, i + 2));
  const extras = [korailSlide(1), mapSec, korailSlide(2)], seq = [korailSlide(0)];  // 코레일이 첫 페이지
  pairs.forEach((p, i) => { seq.push(...p); if (i < extras.length) seq.push(extras[i]); });
  if (!seq.includes(mapSec)) seq.push(mapSec);
  const stage = document.getElementById("stage"), keep = [...seq, document.getElementById("dots"), document.getElementById("st"), document.getElementById("ms")];
  stage.replaceChildren(...keep);
  document.getElementById("dots").innerHTML = "<span></span>".repeat(seq.length);
  show(idx >= seq.length ? 0 : idx);
  if (KM) setTimeout(() => KM.relayout(), 100);
}
function show(i) {
  const s = document.querySelectorAll(".slide"); if (!s.length) return;
  idx = (i + s.length) % s.length;
  s.forEach((e,k) => e.classList.toggle("on", k === idx));
  document.querySelectorAll("#dots span").forEach((e,k) => e.classList.toggle("on", k === idx));
  if (KM && s[idx] === mapSec) setTimeout(() => KM.relayout(), 50);
}
function schedule() {
  clearTimeout(timer);
  const s = document.querySelector(".slide.on"), d = (s && +s.dataset.dur) || 8;
  timer = setTimeout(() => { show(idx + 1); schedule(); }, d * 1000);
}
document.body.addEventListener("click", () => { show(idx + 1); schedule(); keepAwake(); });

function tick() {
  const t = new Date().toLocaleTimeString("ko-KR", {hour12:false, hour:"2-digit", minute:"2-digit"});
  document.querySelectorAll("[data-clk]").forEach(e => e.textContent = t);
  const el_ = (Date.now() - fetchedAt) / 1000;
  document.querySelectorAll(".mn[data-eta]").forEach(e => {
    const rem = Math.max(0, +e.dataset.eta - el_), m = Math.floor(rem / 60);
    e.querySelector("b").textContent = rem < 60 ? "곧" : m;
    e.querySelector("small").innerHTML = rem < 60 ? "도착" : "분후<br>도착예정";
  });
  document.querySelectorAll(".train").forEach(e => {
    const rem = Math.max(0, +e.dataset.eta - el_), n = +e.dataset.n;
    e.style.left = (8 + 84 * Math.min(n, Math.max(0, n - rem / STATION_GAP_SEC)) / n) + "%";
  });
  TR.forEach((T, k) => {
    const rem = Math.max(0, T.eta - el_), p = Math.min(T.n, Math.max(0, T.n - rem / STATION_GAP_SEC));
    const i = Math.min(Math.floor(p), T.n - 1), f = p - i, a = T.ll[i], b = T.ll[i+1];
    const lat = a[0] + (b[0]-a[0]) * f, lng = a[1] + (b[1]-a[1]) * f;
    const txt = rem < 60 ? "곧 도착" : `${T.name} ${Math.floor(rem/60)}분`;
    if (T.mk) {
      T.mk.setPosition(new kakao.maps.LatLng(lat, lng));
      T.el.querySelector(".eta").textContent = txt;
      T.el.querySelector("svg").style.transform = b[1] >= a[1] ? "" : "scaleX(-1)";
    } else {
      const g = document.querySelector(`[data-f="${k}"]`); if (!g) return;
      const [x,y] = proj([lat, lng]);
      g.style.transform = `translate(${x}px,${y}px)`;
      g.querySelector("[data-eta-t]").textContent = txt;
    }
  });
}
setInterval(tick, 1000);

async function load() {
  const st = document.getElementById("st");
  if (CONFIG.WORKER) {
    try {
      const j = await (await fetch(CONFIG.WORKER + "/subway")).json();
      data = j.realtimeArrivalList || [];
      if (data.length) st.textContent = "";
      else { data = demo(); st.innerHTML = "<b>지하철: 데모 데이터</b> (서울 키 필요)"; }
    } catch (e) { data = demo(); st.innerHTML = "<b>불러오기 실패</b> · 데모 표시 중"; }
  }
  else if (!CONFIG.API_KEY && CONFIG.BASE.indexOf("swopenAPI") > -1) { data = demo(); st.innerHTML = "<b>데모 데이터</b>"; }
  else try {
    const u = `${CONFIG.BASE}/${CONFIG.API_KEY}/json/realtimeStationArrival/0/30/${encodeURIComponent(CONFIG.STATION)}`;
    const j = await (await fetch(u)).json();
    data = j.realtimeArrivalList || []; st.textContent = "";
  } catch (e) { data = demo(); st.innerHTML = "<b>불러오기 실패</b> · 데모 표시 중"; }
  const ku = CONFIG.KORAIL_URL || (CONFIG.WORKER ? CONFIG.WORKER + "/korail" : "");
  if (ku) try { const k = await (await fetch(ku)).json(); korail = Array.isArray(k) && k.length ? k : null; } catch (e) { korail = null; }
  fetchedAt = Date.now();
  render(); setTrains();
}

// TV용: 화면 맞춤, 화면 꺼짐 방지, 자동 새로고침
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); document.getElementById("stage").style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener("resize", fit); fit();
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
keepAwake(); document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
setTimeout(() => location.reload(), CONFIG.RELOAD_HOURS * 3600 * 1000);

makeMapSec();
document.getElementById("stage").prepend(mapSec);
initKakao();
load().then(schedule);
setInterval(load, CONFIG.REFRESH_SEC * 1000);
</script>
